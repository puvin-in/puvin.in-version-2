services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: puvin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping: 1}).ok' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: puvin-app:local
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://puvin:${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}@mongo:27017/puvin?authSource=admin
      WEBSITE_URL: ${SITE_ORIGIN:-http://localhost:8080}
      ADMIN_URL: ${SITE_ORIGIN:-http://localhost:8080}/admin/
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  website:
    image: puvin-app:local
    build:
      context: .
      target: app
    command: ["node", "apps/website/dist/website/server/server.mjs"]
    init: true
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4100
      NG_ALLOWED_HOSTS: ${SITE_HOST:-localhost}
    depends_on:
      api:
        condition: service_healthy

  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
