<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>PUVIN CMS</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="login">
    <form id="login-form" class="panel" novalidate>
      <p class="eyebrow">PUVIN.IN / CONTROL ROOM</p><h1>Welcome back.</h1>
      <p class="muted">Sign in with the administrator configured in your environment.</p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button><p class="notice" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="app" id="app" hidden>
    <aside><a class="logo" href="/">PUVIN<span>.IN</span></a><p class="eyebrow">CMS</p>
      <nav aria-label="Administration">
        <button data-view="dashboard" class="active">Overview</button><button data-view="posts">Posts</button><button data-view="projects">Projects</button><button data-view="services">Services</button><button data-view="media">Media</button><button data-view="messages">Messages <b id="new-messages"></b></button><button data-view="users">Users</button><button data-view="settings">Settings</button>
      </nav><div class="side-bottom"><a href="/" target="_blank" rel="noopener">↗ View site</a><button id="logout">Sign out</button></div>
    </aside>
    <main><header><div><p class="eyebrow" id="section-label">OVERVIEW</p><h1 id="section-title">Dashboard</h1></div><button class="primary" id="new-record" hidden>+ New</button></header><section id="content" aria-live="polite"></section></main>
  </div>
  <dialog id="editor"><form method="dialog" id="editor-form" class="panel editor"><div class="dialog-head"><h2 id="editor-title">Edit</h2><button value="cancel" class="icon" aria-label="Close">×</button></div><div id="fields"></div><div class="actions"><button value="cancel">Cancel</button><button class="primary" value="save">Save changes</button></div><p class="notice" role="status"></p></form></dialog>
  <script src="/assets/js/admin.js"></script>
</body></html>
